name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - name: No sorry or admit
        run: |
          if grep -R -nE '\b(sorry|admit)\b' LeanGeospatial; then
            exit 1
          fi
