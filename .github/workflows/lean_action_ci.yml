name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: No sorry or admit
        run: |
          if grep -R -nE '\b(sorry|admit)\b' LeanGeospatial; then
            exit 1
          fi
      - name: Library does not import Examples
        run: |
          if grep -rn '^import .*Examples' LeanGeospatial.lean Main.lean LeanGeospatial --include=*.lean | grep -v '^LeanGeospatial/Examples/'; then
            exit 1
          fi
      - name: Generated composition-table files are up to date
        run: |
          python3 scripts/gen_rcc8_table.py
          git diff --exit-code
      - name: Validator samples give the expected verdicts
        run: |
          lake build lean-geospatial
          .lake/build/bin/lean-geospatial samples/*.txt | diff - samples/expected.out
      - name: Prover samples give the expected answers
        run: |
          lake build lean-geospatial-prover
          .lake/build/bin/lean-geospatial-prover < samples/prover.jsonl | diff - samples/prover.expected.jsonl
      - name: Prover contract (one answer per non-blank line, exit code 0)
        run: |
          .lake/build/bin/lean-geospatial-prover < samples/prover-contract.jsonl > contract.out
          test "$(grep -c . samples/prover-contract.jsonl)" -eq "$(wc -l < contract.out)"
          diff contract.out samples/prover-contract.expected.jsonl
