name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: No sorry or admit
        run: |
          if grep -R -nE '\b(sorry|admit)\b' LeanGeospatial; then
            exit 1
          fi
      - name: Library does not import Examples
        run: |
          if grep -rn '^import .*Examples' LeanGeospatial.lean Main.lean LeanGeospatial --include=*.lean | grep -v '^LeanGeospatial/Examples/'; then
            exit 1
          fi
      - name: Generated composition-table files are up to date
        run: |
          python3 scripts/gen_rcc8_table.py
          python3 scripts/gen_line_witnesses.py
          python3 scripts/gen_circle_witnesses.py
          git diff --exit-code
      - name: Validator samples give the expected verdicts
        run: |
          lake build lean-geospatial
          .lake/build/bin/lean-geospatial samples/*.txt | diff - samples/expected.out
      - name: Prover samples give the expected answers
        run: |
          lake build lean-geospatial-prover
          .lake/build/bin/lean-geospatial-prover < samples/prover.jsonl | diff - samples/prover.expected.jsonl
      - name: Prover contract (one answer per non-blank line, exit code 0)
        run: |
          .lake/build/bin/lean-geospatial-prover < samples/prover-contract.jsonl > contract.out
          test "$(grep -c . samples/prover-contract.jsonl)" -eq "$(wc -l < contract.out)"
          diff contract.out samples/prover-contract.expected.jsonl
      - name: Prover streams many lines in constant stack
        run: python3 scripts/prover_stream_test.py --lines 20000 --stack-kb 256

  # LeanGeodesy, LeanGeospatial and LeanComputationalGeometry must stay
  # importable together, on one plane. Each sibling is taken from the branch of
  # the same name when it exists, so a coordinated change can be tested across
  # all three before merging.
  joint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          path: LeanGeospatial
      - name: Check out the sibling libraries
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          for sib in LeanGeodesy LeanComputationalGeometry; do
            if git ls-remote --exit-code --heads "https://github.com/yuiseki/$sib" "$branch" > /dev/null; then
              ref="$branch"
            else
              ref=main
            fi
            echo "Using $sib $ref"
            git clone --depth 1 --branch "$ref" "https://github.com/yuiseki/$sib" "$sib"
          done
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The three libraries share one plane
        run: LeanGeospatial/scripts/joint_check.sh LeanGeodesy LeanGeospatial LeanComputationalGeometry joint
