name = "lean-geospatial"
version = "0.1.0"
defaultTargets = ["LeanGeospatial", "lean-geospatial", "lean-geospatial-prover"]

[[lean_lib]]
name = "LeanGeospatial"
globs = ["LeanGeospatial.*"]

[[lean_exe]]
name = "lean-geospatial"
root = "Main"

[[lean_exe]]
name = "lean-geospatial-prover"
root = "ProverMain"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.16.0"
